# CIF learning platform — demo stack for a single VPS (AADI is one programme on it):
#  - aadi-cloud : the central brain (demo data, 10 hamlets)
#  - aadi-hub   : a simulated centre hub for Pachakkudi, syncing to the cloud — shows offline/sync live
#  - caddy      : HTTPS reverse proxy (only on servers with no web server yet: --profile caddy)
# AADI listens on 127.0.0.1:8181 (cloud) and 127.0.0.1:8182 (hub) so an existing web server
# on the VPS (e.g. a system Caddy or nginx) can proxy to it. deploy/install.sh picks the right mode.
services:
  aadi-cloud:
    build: ..
    restart: unless-stopped
    environment:
      AADI_NODE: cloud-1
      PLATFORM_NAME: ${PLATFORM_NAME:-CIF Learning Platform}
      PLATFORM_NAME_ML: ${PLATFORM_NAME_ML:-സി.ഐ.എഫ് പഠന വേദി}
      PLATFORM_SHORT: ${PLATFORM_SHORT:-CIF Learning}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      AADI_TRANSLATE_MODE: ${AADI_TRANSLATE_MODE:-classic-colloquial}
      AADI_TRANSLATE_MONTHLY_CAP: ${AADI_TRANSLATE_MONTHLY_CAP:-500000}
      AADI_ROLE: cloud
      AADI_DEMO: "1"
      AADI_SYNC_KEY: ${AADI_SYNC_KEY}
      PORT: 8080
    ports: ["127.0.0.1:${AADI_CLOUD_PORT:-8181}:8080"]
    volumes: [cloud-data:/app/data]
    command: sh -c "[ -f /app/data/cloud-1.db ] || node --disable-warning=ExperimentalWarning scripts/seed.js; exec node --disable-warning=ExperimentalWarning server.js"
  aadi-hub:
    build: ..
    restart: unless-stopped
    depends_on: [aadi-cloud]
    environment:
      AADI_NODE: hub-pachakkudi
      PLATFORM_NAME: ${PLATFORM_NAME:-CIF Learning Platform}
      PLATFORM_NAME_ML: ${PLATFORM_NAME_ML:-സി.ഐ.എഫ് പഠന വേദി}
      PLATFORM_SHORT: ${PLATFORM_SHORT:-CIF Learning}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      AADI_TRANSLATE_MODE: ${AADI_TRANSLATE_MODE:-classic-colloquial}
      AADI_TRANSLATE_MONTHLY_CAP: ${AADI_TRANSLATE_MONTHLY_CAP:-500000}
      AADI_ROLE: hub
      AADI_DEMO: "1"
      AADI_UPSTREAM: http://aadi-cloud:8080
      AADI_SYNC_KEY: ${AADI_SYNC_KEY}
      AADI_HUB_HAMLETS: ${AADI_HUB_HAMLETS:-}
      PORT: 8080
    ports: ["127.0.0.1:${AADI_HUB_PORT:-8182}:8080"]
    volumes: [hub-data:/app/data]
  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      CLOUD_DOMAIN: ${CLOUD_DOMAIN}
      HUB_DOMAIN: ${HUB_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [aadi-cloud, aadi-hub]
volumes: { cloud-data: {}, hub-data: {}, caddy-data: {} }
