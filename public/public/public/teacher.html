<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aadi — Teacher Dashboard</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f5; margin: 0; padding: 20px; }
  .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 700px; margin: 0 auto 20px; }
  h1 { color: #2e5339; font-size: 20px; }
  h2 { font-size: 16px; color: #2e5339; border-bottom: 2px solid #e5e5e5; padding-bottom: 6px; }
  label { display: block; margin-top: 10px; font-weight: bold; font-size: 13px; }
  input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-top: 14px; padding: 10px 18px; background: #2e5339; color: white; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #244430; }
  .topbar { display: flex; justify-content: space-between; align-items: center; max-width: 700px; margin: 0 auto 16px; }
  #logout { background: #a3261a; padding: 6px 14px; font-size: 13px; }
  .msg { font-size: 13px; margin-top: 8px; }
  .ok { color: #1a6b34; } .err { color: #a3261a; }
</style>
</head>
<body>
<div class="topbar">
  <h1>Aadi — Teacher Dashboard</h1>
  <button id="logout">Log out</button>
</div>

<div class="card">
  <h2>Mark Attendance (today)</h2>
  <form id="attForm">
    <label>Student</label><select id="attStudent" required></select>
    <label>Status</label>
    <select id="attPresent"><option value="true">Present</option><option value="false">Absent</option></select>
    <button type="submit">Save Attendance</button>
  </form>
  <div class="msg" id="attMsg"></div>
</div>

<div class="card">
  <h2>Weekly Assessment Score</h2>
  <form id="assessForm">
    <label>Student</label><select id="asStudent" required></select>
    <label>Subject</label><input type="text" id="asSubject" required>
    <label>Score</label><input type="number" id="asScore" step="0.1" required>
    <label>Max Score</label><input type="number" id="asMax" step="0.1" required>
    <label>Remarks</label><input type="text" id="asRemarks">
    <button type="submit">Save Score</button>
  </form>
  <div class="msg" id="assessMsg"></div>
</div>

<div class="card">
  <h2>Monthly Progress Note</h2>
  <form id="progForm">
    <label>Student</label><select id="prStudent" required></select>
    <label>Month (1-12)</label><input type="number" id="prMonth" min="1" max="12" required>
    <label>Year</label><input type="number" id="prYear" required>
    <label>Summary</label><input type="text" id="prSummary" required>
    <button type="submit">Save Note</button>
  </form>
  <div class="msg" id="progMsg"></div>
</div>

<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = 'login.html';

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
}

document.getElementById('logout').addEventListener('click', () => {
  localStorage.clear();
  window.location.href = 'login.html';
});

async function loadStudentDropdowns() {
  const res = await fetch('/api/students', { headers: authHeaders() });
  const students = await res.json();
  const opts = students.map(s => `<option value="${s.id}">${s.name} (${s.classGroup||'—'})</option>`).join('');
  document.getElementById('attStudent').innerHTML = opts;
  document.getElementById('asStudent').innerHTML = opts;
  document.getElementById('prStudent').innerHTML = opts;
}

document.getElementById('attForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('attMsg');
  const res = await fetch('/api/attendance', {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({
      studentId: document.getElementById('attStudent').value,
      date: new Date().toISOString().slice(0,10),
      present: document.getElementById('attPresent').value === 'true'
    })
  });
  msg.className = res.ok ? 'msg ok' : 'msg err';
  msg.textContent = res.ok ? 'Attendance saved.' : 'Error saving attendance.';
});

document.getElementById('assessForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('assessMsg');
  const res = await fetch('/api/assessments', {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({
      studentId: document.getElementById('asStudent').value,
      date: new Date().toISOString().slice(0,10),
      subject: document.getElementById('asSubject').value,
      score: document.getElementById('asScore').value,
      maxScore: document.getElementById('asMax').value,
      remarks: document.getElementById('asRemarks').value
    })
  });
  if (res.ok) { msg.className = 'msg ok'; msg.textContent = 'Score saved.'; e.target.reset(); }
  else { msg.className = 'msg err'; msg.textContent = 'Error saving score.'; }
});

document.getElementById('progForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('progMsg');
  const res = await fetch('/api/progress', {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({
      studentId: document.getElementById('prStudent').value,
      month: document.getElementById('prMonth').value,
      year: document.getElementById('prYear').value,
      summary: document.getElementById('prSummary').value
    })
  });
  if (res.ok) { msg.className = 'msg ok'; msg.textContent = 'Note saved.'; e.target.reset(); }
  else { msg.className = 'msg err'; msg.textContent = 'Error saving note.'; }
});

loadStudentDropdowns();
</script>
</body>
</html>
