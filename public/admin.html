<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aadi — Admin Dashboard</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f5; margin: 0; padding: 20px; }
  .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 700px; margin: 0 auto 20px; }
  h1 { color: #2e5339; font-size: 20px; }
  h2 { font-size: 16px; color: #2e5339; border-bottom: 2px solid #e5e5e5; padding-bottom: 6px; }
  label { display: block; margin-top: 10px; font-weight: bold; font-size: 13px; }
  input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-top: 14px; padding: 10px 18px; background: #2e5339; color: white; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #244430; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { text-align: left; padding: 6px; border-bottom: 1px solid #eee; }
  .topbar { display: flex; justify-content: space-between; align-items: center; max-width: 700px; margin: 0 auto 16px; }
  #logout { background: #a3261a; padding: 6px 14px; font-size: 13px; }
  .msg { font-size: 13px; margin-top: 8px; }
  .ok { color: #1a6b34; } .err { color: #a3261a; }
</style>
</head>
<body>
<div class="topbar">
  <h1>Aadi — Admin Dashboard</h1>
  <button id="logout">Log out</button>
</div>

<div class="card">
  <h2>Add a Center</h2>
  <form id="centerForm">
    <label>Center Name</label><input type="text" id="centerName" required>
    <label>Settlement</label><input type="text" id="settlement">
    <label>District</label><input type="text" id="district">
    <button type="submit">Add Center</button>
  </form>
  <div class="msg" id="centerMsg"></div>
</div>

<div class="card">
  <h2>Add a Teacher</h2>
  <form id="teacherForm">
    <label>Name</label><input type="text" id="tName" required>
    <label>Email</label><input type="email" id="tEmail" required>
    <label>Password</label><input type="password" id="tPassword" required minlength="6">
    <label>Phone</label><input type="text" id="tPhone">
    <label>Center</label><select id="tCenter"></select>
    <button type="submit">Add Teacher</button>
  </form>
  <div class="msg" id="teacherMsg"></div>
</div>

<div class="card">
  <h2>Add a Student</h2>
  <form id="studentForm">
    <label>Name</label><input type="text" id="sName" required>
    <label>Email (used as login ID)</label><input type="email" id="sEmail" required>
    <label>Password</label><input type="password" id="sPassword" required minlength="6">
    <label>Phone</label><input type="text" id="sPhone">
    <label>Class Group</label>
    <select id="sClassGroup">
      <option>Class 1-7</option>
      <option>Class 8-12</option>
      <option>Youth / Job-seeking</option>
    </select>
    <label>Center</label><select id="sCenter"></select>
    <label><input type="checkbox" id="sSmartphone" style="width:auto;display:inline;margin-right:6px;">Has smartphone access</label>
    <button type="submit">Add Student</button>
  </form>
  <div class="msg" id="studentMsg"></div>
</div>

<div class="card">
  <h2>Centers</h2>
  <table id="centerTable"><thead><tr><th>Name</th><th>Settlement</th><th>District</th></tr></thead><tbody></tbody></table>
</div>

<div class="card">
  <h2>Teachers</h2>
  <table id="teacherTable"><thead><tr><th>Name</th><th>Email</th><th>Phone</th></tr></thead><tbody></tbody></table>
</div>

<div class="card">
  <h2>Students</h2>
  <table id="studentTable"><thead><tr><th>Name</th><th>Class</th><th>Smartphone</th></tr></thead><tbody></tbody></table>
</div>

<script>
const token = localStorage.getItem('token');
if (!token || localStorage.getItem('role') !== 'admin') window.location.href = 'login.html';

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
}

document.getElementById('logout').addEventListener('click', () => {
  localStorage.clear();
  window.location.href = 'login.html';
});

async function loadCenters() {
  const res = await fetch('/api/centers', { headers: authHeaders() });
  const centers = await res.json();
  const tbody = document.querySelector('#centerTable tbody');
  tbody.innerHTML = '';
  const tCenterSel = document.getElementById('tCenter');
  const sCenterSel = document.getElementById('sCenter');
  tCenterSel.innerHTML = ''; sCenterSel.innerHTML = '';
  centers.forEach(c => {
    tbody.innerHTML += `<tr><td>${c.name}</td><td>${c.settlement||''}</td><td>${c.district||''}</td></tr>`;
    const opt = `<option value="${c.id}">${c.name}</option>`;
    tCenterSel.innerHTML += opt; sCenterSel.innerHTML += opt;
  });
}

async function loadUsers(role, tableId, rowFn) {
  const res = await fetch('/api/users?role=' + role, { headers: authHeaders() });
  const users = await res.json();
  const tbody = document.querySelector('#' + tableId + ' tbody');
  tbody.innerHTML = '';
  users.forEach(u => tbody.innerHTML += rowFn(u));
}

document.getElementById('centerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('centerMsg');
  const res = await fetch('/api/centers', {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({
      name: document.getElementById('centerName').value,
      settlement: document.getElementById('settlement').value,
      district: document.getElementById('district').value
    })
  });
  if (res.ok) { msg.className = 'msg ok'; msg.textContent = 'Center added.'; e.target.reset(); loadCenters(); }
  else { msg.className = 'msg err'; msg.textContent = 'Error adding center.'; }
});

document.getElementById('teacherForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('teacherMsg');
  const res = await fetch('/api/auth/register', {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({
      name: document.getElementById('tName').value,
      email: document.getElementById('tEmail').value,
      password: document.getElementById('tPassword').value,
      phone: document.getElementById('tPhone').value,
      role: 'teacher',
      centerId: document.getElementById('tCenter').value
    })
  });
  const data = await res.json();
  if (res.ok) { msg.className = 'msg ok'; msg.textContent = 'Teacher added.'; e.target.reset(); loadUsers('teacher', 'teacherTable', u => `<tr><td>${u.name}</td><td>${u.email}</td><td>${u.phone||''}</td></tr>`); }
  else { msg.className = 'msg err'; msg.textContent = data.error || 'Error adding teacher.'; }
});

document.getElementById('studentForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('studentMsg');
  const res = await fetch('/api/auth/register', {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({
      name: document.getElementById('sName').value,
      email: document.getElementById('sEmail').value,
      password: document.getElementById('sPassword').value,
      phone: document.getElementById('sPhone').value,
      classGroup: document.getElementById('sClassGroup').value,
      smartphoneAccess: document.getElementById('sSmartphone').checked,
      role: 'student',
      centerId: document.getElementById('sCenter').value
    })
  });
  const data = await res.json();
  if (res.ok) { msg.className = 'msg ok'; msg.textContent = 'Student added.'; e.target.reset(); loadStudents(); }
  else { msg.className = 'msg err'; msg.textContent = data.error || 'Error adding student.'; }
});

function loadStudents() {
  loadUsers('student', 'studentTable', u => `<tr><td>${u.name}</td><td>${u.classGroup||''}</td><td>${u.smartphoneAccess ? 'Yes' : 'No'}</td></tr>`);
}

loadCenters();
loadUsers('teacher', 'teacherTable', u => `<tr><td>${u.name}</td><td>${u.email}</td><td>${u.phone||''}</td></tr>`);
loadStudents();
</script>
</body>
</html>
